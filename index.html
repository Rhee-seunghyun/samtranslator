<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>샘치과 통역기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Noto+Sans:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* 환자 쪽 (상단): 화이트 */
    --patient-bg: #ffffff;
    --patient-bg-active: #f1f1f1;
    --patient-text: #3a3a3a;
    --patient-sub: #9a9a9a;

    /* 의료진 쪽 (하단): 그레이 */
    --doctor-bg: #6e6e6e;
    --doctor-bg-active: #5c5c5c;
    --doctor-text: #ffffff;
    --doctor-sub: #d6d6d6;

    --divider-bg: #ffffff;
    --accent: #6e6e6e;
    --disabled: 0.35;

    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: 'Noto Sans KR', 'Noto Sans', sans-serif;
    background: var(--divider-bg);
  }

  body {
    display: flex;
    flex-direction: column;
    padding-top: var(--safe-t);
    padding-bottom: var(--safe-b);
    padding-left: var(--safe-l);
    padding-right: var(--safe-r);
  }

  .half {
    flex: 1 1 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 48px;
    transition: background 0.25s ease;
    overflow: hidden;
  }

  #patientHalf {
    background: var(--patient-bg);
    transform: rotate(180deg);
    border-bottom: 1px solid #ececec;
  }
  #patientHalf.active { background: var(--patient-bg-active); }

  #doctorHalf { background: var(--doctor-bg); }
  #doctorHalf.active { background: var(--doctor-bg-active); }

  .content-row {
    display: flex;
    align-items: center;
    gap: 40px;
    width: 100%;
    max-width: 2100px;
  }

  .flag-btn {
    flex: 0 0 auto;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 6px solid rgba(0,0,0,0.08);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .flag-btn img.flag-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }
  .flag-btn:active { transform: scale(0.94); }
  .flag-btn.listening {
    border-color: var(--accent);
    box-shadow: 0 0 0 10px rgba(110,110,110,0.18), 0 6px 18px rgba(0,0,0,0.25);
  }
  .flag-btn.disabled {
    opacity: var(--disabled);
    pointer-events: none;
  }
  .flag-btn .pulse-ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 4px solid var(--accent);
    opacity: 0;
  }
  .flag-btn.listening .pulse-ring {
    animation: pulseRing 1.4s ease-out infinite;
  }
  @keyframes pulseRing {
    0% { transform: scale(0.9); opacity: 0.7; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  .text-area { flex: 1 1 auto; min-width: 0; }

  .status-label {
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 12px 0;
    opacity: 0.75;
    letter-spacing: 0.5px;
  }
  #patientHalf .status-label { color: var(--patient-sub); }
  #doctorHalf .status-label { color: var(--doctor-sub); }

  .translated-text {
    font-size: 58px;
    font-weight: 900;
    line-height: 1.35;
    word-break: keep-all;
    max-height: 320px;
    overflow-y: auto;
  }
  #patientHalf .translated-text { color: var(--patient-text); }
  #doctorHalf .translated-text { color: var(--doctor-text); }

  .placeholder { opacity: 0.4; font-weight: 700; }

  .original-text {
    font-size: 24px;
    font-weight: 700;
    margin-top: 14px;
    opacity: 0.7;
    line-height: 1.4;
  }
  #patientHalf .original-text { color: var(--patient-sub); }
  #doctorHalf .original-text { color: var(--doctor-sub); }

  /* 브랜드 로고 */
  .brand-logo {
    position: absolute;
    top: 28px;
    left: 40px;
    height: 32px;
    width: auto;
    opacity: 0.85;
  }
  #doctorHalf .brand-mark {
    position: absolute;
    bottom: 26px;
    right: 32px;
    height: 44px;
    width: auto;
    opacity: 0.85;
    filter: brightness(0) invert(1);
  }

  /* center arrow indicator */
  #centerIndicator {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(1);
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: var(--divider-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    transition: transform 0.06s linear, background 0.2s ease;
  }
  #centerIndicator .center-icon-logo { width: 52px; height: 52px; object-fit: contain; }

  /* 상태 아이콘: 평소/번역 중엔 샘치과 로고, 듣는 중 / 변환 중엔 전용 아이콘 */
  .center-icon-alt {
    display: none;
    width: 56px;
    height: 56px;
    object-fit: contain;
  }
  #centerIndicator.state-listening .center-icon-logo { display: none; }
  #centerIndicator.state-listening .icon-listening { display: block; }
  #centerIndicator.state-converting .center-icon-logo { display: none; }
  #centerIndicator.state-converting .icon-converting {
    display: block;
    animation: spinIcon 1s linear infinite;
  }
  @keyframes spinIcon {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  #centerIndicator.state-listening {
    animation: centerPulse 1.1s ease-in-out infinite;
  }
  @keyframes centerPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.18); }
  }

  /* settings gear on patient side (drawn upright for patient since half is rotated 180) */
  .settings-btn {
    position: absolute;
    top: 28px;
    right: 28px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    cursor: pointer;
  }

  /* settings panel */
  #settingsOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #settingsOverlay.open { display: flex; }
  #settingsPanel {
    background: #ffffff;
    border-radius: 24px;
    padding: 40px;
    width: 640px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  #settingsPanel h2 {
    margin: 0 0 24px 0;
    font-size: 32px;
    font-weight: 900;
    color: #3a3a3a;
  }
  .lang-option {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 16px;
    border-radius: 14px;
    font-size: 26px;
    font-weight: 700;
    cursor: pointer;
    border: 3px solid transparent;
    margin-bottom: 8px;
    color: #3a3a3a;
  }
  .lang-option.selected {
    border-color: var(--accent);
    background: #f1f1f1;
  }
  .lang-option .flag-emoji { font-size: 34px; }
  .lang-option img.flag-emoji {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.1);
  }

  /* 용어집 설정 탭 */
  .settings-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .settings-tab {
    flex: 1;
    padding: 14px;
    font-size: 22px;
    font-weight: 900;
    border: 3px solid #eee;
    border-radius: 12px;
    background: #fff;
    color: #9a9a9a;
    cursor: pointer;
  }
  .settings-tab.active {
    border-color: var(--accent);
    color: #3a3a3a;
    background: #f1f1f1;
  }
  .settings-panel-content { display: none; }
  .settings-panel-content.active { display: block; }
  .glossary-hint {
    font-size: 16px;
    color: #9a9a9a;
    margin: 0 0 16px 0;
    font-weight: 700;
    line-height: 1.5;
  }
  .glossary-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .glossary-row input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font-size: 18px;
    font-weight: 700;
    border: 2px solid #eee;
    border-radius: 10px;
    color: #3a3a3a;
    font-family: inherit;
  }
  .glossary-row .glossary-arrow { color: #b9b9b9; font-weight: 900; font-size: 18px; }
  .glossary-row .glossary-del {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 10px;
    background: #f1f1f1;
    color: #9a9a9a;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
  }
  #addGlossaryBtn {
    margin-top: 10px;
    width: 100%;
    padding: 14px;
    font-size: 20px;
    font-weight: 900;
    border: 2px dashed #ccc;
    border-radius: 12px;
    background: #fff;
    color: #9a9a9a;
    cursor: pointer;
  }
  #closeSettings {
    margin-top: 20px;
    width: 100%;
    padding: 18px;
    font-size: 26px;
    font-weight: 900;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .version-tag {
    margin: 14px 0 0 0;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #c3c3c3;
    letter-spacing: 0.3px;
  }
</style>
</head>

const LANGS = [
  { code: 'en-US', short: 'en', country: 'us', name: 'English (미국)' },
  { code: 'zh-CN', short: 'zh-CN', country: 'cn', name: '中文 (중국)' },
  { code: 'ja-JP', short: 'ja', country: 'jp', name: '日本語 (일본)' },
  { code: 'vi-VN', short: 'vi', country: 'vn', name: 'Tiếng Việt (베트남)' },
  { code: 'th-TH', short: 'th', country: 'th', name: 'ภาษาไทย (태국)' },
  { code: 'ru-RU', short: 'ru', country: 'ru', name: 'Русский (러시아)' },
  { code: 'mn-MN', short: 'mn', country: 'mn', name: 'Монгол (몽골)' },
  { code: 'fr-FR', short: 'fr', country: 'fr', name: 'Français (프랑스)' },
  { code: 'es-ES', short: 'es', country: 'es', name: 'Español (스페인)' },
];

function flagUrl(countryCode) {
  return `https://flagcdn.com/${countryCode}.svg`;
}

const PLACEHOLDERS = {
  'en-US': 'Please touch the flag and speak',
  'zh-CN': '请触摸国旗并说话',
  'ja-JP': '国旗をタッチして話してください',
  'vi-VN': 'Vui lòng chạm vào quốc kỳ và nói',
  'th-TH': 'กรุณาแตะธงชาติแล้วพูด',
  'ru-RU': 'Коснитесь флага и говорите',
  'mn-MN': 'Туг дээр хүрч ярина уу',
  'fr-FR': 'Touchez le drapeau et parlez',
  'es-ES': 'Toque la bandera y hable',
};

let patientLang = LANGS[0];

let recognition = null;
let audioCtx = null, analyser = null, micStream = null, rafId = null;
let listeningSide = null; // 'doctor' | 'patient' | null

const patientFlagBtn = document.getElementById('patientFlagBtn');
const doctorFlagBtn = document.getElementById('doctorFlagBtn');
const patientHalf = document.getElementById('patientHalf');
const doctorHalf = document.getElementById('doctorHalf');
const patientText = document.getElementById('patientText');
const doctorText = document.getElementById('doctorText');
const patientOriginalText = document.getElementById('patientOriginalText');
const doctorOriginalText = document.getElementById('doctorOriginalText');
const patientStatus = document.getElementById('patientStatus');
const doctorStatus = document.getElementById('doctorStatus');
const centerIndicator = document.getElementById('centerIndicator');
const patientFlagImg = document.getElementById('patientFlagImg');

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function renderPatientPlaceholder() {
  patientFlagImg.src = flagUrl(patientLang.country);
  patientFlagImg.alt = patientLang.name;
  patientText.textContent = PLACEHOLDERS[patientLang.code] || PLACEHOLDERS['en-US'];
  patientText.classList.add('placeholder');
}
renderPatientPlaceholder();

function setDisabled(side, disabled) {
  const btn = side === 'doctor' ? doctorFlagBtn : patientFlagBtn;
  btn.classList.toggle('disabled', disabled);
}

// 중앙 인디케이터 상태: idle(화살표) / listening(듣는 중) / converting(음성->텍스트 변환 중) / translating(번역 중, 화살표)
function setCenterState(state) {
  centerIndicator.classList.remove('state-listening', 'state-converting', 'state-translating');
  if (state && state !== 'idle') {
    centerIndicator.classList.add('state-' + state);
  }
}

function setListeningUI(side, on) {
  const btn = side === 'doctor' ? doctorFlagBtn : patientFlagBtn;
  const half = side === 'doctor' ? doctorHalf : patientHalf;
  const status = side === 'doctor' ? doctorStatus : patientStatus;
  btn.classList.toggle('listening', on);
  half.classList.toggle('active', on);
  status.textContent = on ? '듣고 있어요...' : (side === 'doctor' ? '눌러서 말씀하세요' : '터치해서 말씀해주세요');
}

// 주의: getUserMedia()로 별도 마이크 스트림을 열어서 음량을 측정하면,
// 모바일 크롬(특히 안드로이드 태블릿)에서 SpeechRecognition이 쓰는 마이크와
// 충돌해서 인식 결과가 전혀 안 나오는 문제가 있었음(PC 크롬은 문제 없었음).
// 그래서 음량 반응 스케일 대신 CSS 펄스 애니메이션(.state-listening)으로 대체.
async function startVolumeMeter() {
  // no-op (마이크 이중 접근 방지)
}

function stopVolumeMeter() {
  centerIndicator.style.transform = 'translate(-50%, -50%) scale(1)';
}

// 구글 클라우드 번역 API (Cloud Translation API v2)
// 주의: 이 키는 프론트엔드에 그대로 노출됩니다. 실제 배포 전 반드시
// 구글 클라우드 콘솔에서 "API 제한사항(Cloud Translation API만 허용)" +
// "애플리케이션 제한사항(HTTP 리퍼러 등)"을 설정해 도용을 막아야 합니다.
const GOOGLE_TRANSLATE_API_KEY = 'AIzaSyCGrIwwoB13-9WjzemdqlKMOnzNi6peIQI';

async function translateText(text, fromShort, toShort) {
  const url = `https://translation.googleapis.com/language/translate/v2?key=${GOOGLE_TRANSLATE_API_KEY}`;
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        q: text,
        source: fromShort,
        target: toShort,
        format: 'text'
      })
    });
    const data = await res.json();
    if (data.error) {
      console.error('Google Translate API error', data.error);
      return null;
    }
    const translated = data?.data?.translations?.[0]?.translatedText;
    return translated ? decodeHtmlEntities(translated) : null;
  } catch (e) {
    console.error('translate error', e);
    return null;
  }
}

function decodeHtmlEntities(str) {
  const el = document.createElement('textarea');
  el.innerHTML = str;
  return el.value;
}

function speak(text, langCode) {
  try {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = langCode;
    window.speechSynthesis.speak(utter);
  } catch(e) {}
}

function handleFlagTap(side) {
  if (!SR) {
    alert('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 브라우저를 사용해주세요.');
    return;
  }
  if (listeningSide && listeningSide !== side) return; // 다른 쪽이 말하는 중이면 무시

  if (listeningSide === side) {
    // 듣기 종료 -> 음성을 텍스트로 변환 중 표시 후 recognition.onend 에서 번역 처리
    setCenterState('converting');
    recognition.stop();
    return;
  }

  // 듣기 시작
  listeningSide = side;
  setDisabled(side === 'doctor' ? 'patient' : 'doctor', true);
  setListeningUI(side, true);
  setCenterState('listening');
  (side === 'doctor' ? doctorOriginalText : patientOriginalText).textContent = '';
  startVolumeMeter();

  recognition = new SR();
  recognition.lang = side === 'doctor' ? 'ko-KR' : patientLang.code;
  recognition.continuous = true; // 말 사이에 잠깐 멈춰도 자동으로 끊기지 않게
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let finalTranscript = '';
  let recognitionError = null;

  recognition.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        finalTranscript += event.results[i][0].transcript;
      }
    }
  };

  recognition.onerror = (event) => {
    console.error('recognition error', event.error);
    recognitionError = event.error; // 진단용: 화면에 그대로 표시
  };

  recognition.onend = async () => {
    stopVolumeMeter();
    setListeningUI(side, false);

    const ownStatusEl = side === 'doctor' ? doctorStatus : patientStatus;
    const targetTextEl = side === 'doctor' ? patientText : doctorText;
    const targetStatusEl = side === 'doctor' ? patientStatus : doctorStatus;
    const originalTextEl = side === 'doctor' ? doctorOriginalText : patientOriginalText;

    if (recognitionError) {
      ownStatusEl.textContent = '음성인식 오류: ' + recognitionError;
      setCenterState('idle');
      setDisabled(side === 'doctor' ? 'patient' : 'doctor', false);
      listeningSide = null;
      return;
    }

    if (finalTranscript.trim()) {
      originalTextEl.textContent = finalTranscript; // 내가 말한 내용이 제대로 인식됐는지 확인용
      targetStatusEl.textContent = '번역 중...';
      setCenterState('translating');
      const fromShort = side === 'doctor' ? 'ko' : patientLang.short;
      const toShort = side === 'doctor' ? patientLang.short : 'ko';

      // 의료진(한국어) -> 영어로 번역할 때만 용어집 적용
      const useGlossary = side === 'doctor' && toShort === 'en';
      let textToSend = finalTranscript;
      let placeholderMap = {};
      if (useGlossary) {
        const result = applyGlossaryBeforeTranslate(finalTranscript);
        textToSend = result.processed;
        placeholderMap = result.placeholderMap;
      }

      let translated = await translateText(textToSend, fromShort, toShort);
      if (translated && useGlossary) {
        translated = restoreGlossaryAfterTranslate(translated, placeholderMap);
      }

      if (translated) {
        targetTextEl.textContent = translated;
        targetTextEl.classList.remove('placeholder');
        speak(translated, side === 'doctor' ? patientLang.code : 'ko-KR');
      } else {
        targetTextEl.textContent = '번역에 실패했어요. 다시 시도해주세요.';
        targetTextEl.classList.remove('placeholder');
      }
      targetStatusEl.textContent = side === 'doctor' ? '터치해서 말씀해주세요' : '눌러서 말씀하세요';
    } else {
      ownStatusEl.textContent = '인식된 음성이 없어요. 다시 시도해주세요.';
    }

    setDisabled(side === 'doctor' ? 'patient' : 'doctor', false);
    setCenterState('idle');
    listeningSide = null;
  };

  recognition.start();
}

doctorFlagBtn.addEventListener('click', () => handleFlagTap('doctor'));
patientFlagBtn.addEventListener('click', () => handleFlagTap('patient'));

// 설정
const settingsOverlay = document.getElementById('settingsOverlay');
const openSettingsBtn = document.getElementById('openSettingsBtn');
const closeSettingsBtn = document.getElementById('closeSettings');
const langList = document.getElementById('langList');

function renderLangList() {
  langList.innerHTML = '';
  LANGS.forEach(l => {
    const div = document.createElement('div');
    div.className = 'lang-option' + (l.code === patientLang.code ? ' selected' : '');
    div.innerHTML = `<img class="flag-emoji" src="${flagUrl(l.country)}" alt="${l.name}"><span>${l.name}</span>`;
    div.addEventListener('click', () => {
      patientLang = l;
      renderPatientPlaceholder();
      renderLangList();
    });
    langList.appendChild(div);
  });
}

openSettingsBtn.addEventListener('click', () => {
  renderLangList();
  renderGlossaryList();
  settingsOverlay.classList.add('open');
});
closeSettingsBtn.addEventListener('click', () => settingsOverlay.classList.remove('open'));
settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('open'); });

// 설정 탭 전환 (언어 / 용어집)
const tabLangBtn = document.getElementById('tabLangBtn');
const tabGlossaryBtn = document.getElementById('tabGlossaryBtn');
const langPanel = document.getElementById('langPanel');
const glossaryPanel = document.getElementById('glossaryPanel');

tabLangBtn.addEventListener('click', () => {
  tabLangBtn.classList.add('active');
  tabGlossaryBtn.classList.remove('active');
  langPanel.classList.add('active');
  glossaryPanel.classList.remove('active');
});
tabGlossaryBtn.addEventListener('click', () => {
  tabGlossaryBtn.classList.add('active');
  tabLangBtn.classList.remove('active');
  glossaryPanel.classList.add('active');
  langPanel.classList.remove('active');
});

// ===== 용어집 =====
// 한국어 → 영어 번역 시, 임상 용어 대신 환자에게 친숙한 표현을 강제 적용합니다.
const DEFAULT_GLOSSARY = [
  { ko: '발치', en: 'pull out the tooth' },
  { ko: '충치', en: 'cavity' },
  { ko: '신경치료', en: 'root canal treatment' },
  { ko: '스케일링', en: 'teeth cleaning' },
  { ko: '임플란트 식립', en: 'putting in an implant' },
  { ko: '크라운', en: 'cap or crown' },
  { ko: '발수', en: 'removing the nerve' },
  { ko: '치석 제거', en: 'removing tartar or plaque' },
  { ko: '잇몸치료', en: 'gum treatment' },
  { ko: '골이식', en: 'adding bone' },
  { ko: '봉합', en: 'stitching up' },
  { ko: '절개', en: 'making a small cut' },
  { ko: '국소마취', en: 'numbing shot' },
  { ko: '진정법', en: 'sleep dentistry' },
  { ko: '정맥진정', en: 'sedation through an IV' },
  { ko: '마취가 풀리다', en: 'the numbness goes away' },
  { ko: '회복실', en: 'rest area' },
  { ko: '시린 증상', en: 'sensitivity to cold or hot' },
  { ko: '부종', en: 'swelling' },
  { ko: '염증', en: 'irritation or swelling' },
  { ko: '출혈', en: 'bleeding' },
  { ko: '씹을 때 아픔', en: 'pain when chewing' },
  { ko: '금식', en: "don't eat or drink" },
  { ko: '지혈', en: 'stop the bleeding' },
  { ko: '거즈 물기', en: 'bite on the gauze' },
  { ko: '찬물 찜질', en: 'ice pack' },
  { ko: '항생제 복용', en: 'take the antibiotics' },
  { ko: '발치 부위', en: 'the empty spot' },
  { ko: '사랑니', en: 'wisdom tooth' },
  { ko: '어금니', en: 'back tooth' },
  { ko: '앞니', en: 'front tooth' },
  { ko: '송곳니', en: 'eye tooth' },
  { ko: '잇몸', en: 'gum' },
  { ko: '턱관절', en: 'jaw joint' },
];

const GLOSSARY_STORAGE_KEY = 'transloatr_glossary';

function loadGlossary() {
  try {
    const saved = localStorage.getItem(GLOSSARY_STORAGE_KEY);
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  return DEFAULT_GLOSSARY.slice();
}

function saveGlossary() {
  try {
    localStorage.setItem(GLOSSARY_STORAGE_KEY, JSON.stringify(glossary));
  } catch (e) {}
}

let glossary = loadGlossary();

const glossaryListEl = document.getElementById('glossaryList');
const addGlossaryBtn = document.getElementById('addGlossaryBtn');

function renderGlossaryList() {
  glossaryListEl.innerHTML = '';
  glossary.forEach((entry, idx) => {
    const row = document.createElement('div');
    row.className = 'glossary-row';
    row.innerHTML = `
      <input type="text" value="${escapeAttr(entry.ko)}" placeholder="한국어 (예: 발치)" data-field="ko">
      <span class="glossary-arrow">→</span>
      <input type="text" value="${escapeAttr(entry.en)}" placeholder="영어 표현 (예: pull out the tooth)" data-field="en">
      <button class="glossary-del" aria-label="삭제">✕</button>
    `;
    const koInput = row.querySelector('input[data-field="ko"]');
    const enInput = row.querySelector('input[data-field="en"]');
    koInput.addEventListener('input', () => { glossary[idx].ko = koInput.value; saveGlossary(); });
    enInput.addEventListener('input', () => { glossary[idx].en = enInput.value; saveGlossary(); });
    row.querySelector('.glossary-del').addEventListener('click', () => {
      glossary.splice(idx, 1);
      saveGlossary();
      renderGlossaryList();
    });
    glossaryListEl.appendChild(row);
  });
}

function escapeAttr(str) {
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

addGlossaryBtn.addEventListener('click', () => {
  glossary.push({ ko: '', en: '' });
  saveGlossary();
  renderGlossaryList();
});

// 텍스트 안의 용어집 항목을 플레이스홀더로 치환 (번역 API가 임의로 바꾸지 못하게 보호)
function applyGlossaryBeforeTranslate(text) {
  let processed = text;
  const placeholderMap = {};
  let counter = 0;
  glossary
    .filter(e => e.ko && e.ko.trim() && e.en && e.en.trim())
    .sort((a, b) => b.ko.length - a.ko.length) // 긴 표현 먼저 치환
    .forEach(entry => {
      if (processed.includes(entry.ko)) {
        counter += 1;
        const token = `Ω${counter}Ω`;
        placeholderMap[token] = entry.en;
        processed = processed.split(entry.ko).join(token);
      }
    });
  return { processed, placeholderMap };
}

function restoreGlossaryAfterTranslate(translated, placeholderMap) {
  let result = translated;
  Object.keys(placeholderMap).forEach(token => {
    // 번역 결과에서 대소문자/공백이 살짝 바뀌는 경우까지 대응
    const pattern = new RegExp(token.replace(/Ω/g, '\\s*Ω\\s*'), 'gi');
    result = result.replace(pattern, placeholderMap[token]);
  });
  return result;
}
</script>
