<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>샘치과 통역기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Noto+Sans:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* 환자 쪽 (상단): 화이트 */
    --patient-bg: #ffffff;
    --patient-bg-active: #f1f1f1;
    --patient-text: #3a3a3a;
    --patient-sub: #9a9a9a;

    /* 의료진 쪽 (하단): 그레이 */
    --doctor-bg: #6e6e6e;
    --doctor-bg-active: #5c5c5c;
    --doctor-text: #ffffff;
    --doctor-sub: #d6d6d6;

    --divider-bg: #ffffff;
    --accent: #6e6e6e;
    --disabled: 0.35;

    /* 화면 크기에 비례하는 치수 (vmin = 화면의 짧은 변 기준 %) */
    --pad: clamp(16px, 3.5vmin, 48px);
    --flag: clamp(64px, 12vmin, 140px);
    --center: clamp(60px, 11vmin, 120px);
    --fs-status: clamp(13px, 2.1vmin, 22px);
    --fs-main: clamp(22px, 4.6vmin, 56px);
    --fs-own: clamp(18px, 3.4vmin, 40px);
    --logo-h: clamp(14px, 2.6vmin, 30px);

    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: 'Noto Sans KR', 'Noto Sans', sans-serif;
    background: var(--divider-bg);
  }

  body {
    display: flex;
    flex-direction: column;
    padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
  }

  .half {
    flex: 1 1 50%;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--pad) calc(var(--pad) * 1.5);
    transition: background 0.25s ease;
    overflow: hidden;
  }

  #patientHalf {
    background: var(--patient-bg);
    transform: rotate(180deg);
    border-bottom: 1px solid #ececec;
  }
  #patientHalf.active { background: var(--patient-bg-active); }
  #doctorHalf { background: var(--doctor-bg); }
  #doctorHalf.active { background: var(--doctor-bg-active); }

  .content-row {
    display: flex;
    align-items: center;
    gap: calc(var(--pad) * 0.9);
    width: 100%;
    max-height: 100%;
  }

  /* ===== 국기 버튼 ===== */
  .flag-btn {
    flex: 0 0 auto;
    width: var(--flag);
    height: var(--flag);
    border-radius: 50%;
    border: 3px solid rgba(0,0,0,0.18);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    position: relative;
  }
  .flag-btn img.flag-img {
    width: 78%;
    height: 78%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }
  .flag-btn:active { transform: scale(0.94); }
  .flag-btn.listening {
    border-color: #e5484d;
    box-shadow: 0 0 0 6px rgba(229,72,77,0.25), 0 4px 14px rgba(0,0,0,0.28);
  }
  .flag-btn.disabled { opacity: var(--disabled); pointer-events: none; }
  .flag-btn .pulse-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 3px solid #e5484d;
    opacity: 0;
    pointer-events: none;
  }
  .flag-btn.listening .pulse-ring { animation: pulseRing 1.4s ease-out infinite; }
  @keyframes pulseRing {
    0% { transform: scale(0.95); opacity: 0.8; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  /* 녹음 중 표시 점 */
  .flag-btn .rec-dot {
    position: absolute;
    top: 4%;
    right: 4%;
    width: 22%;
    height: 22%;
    border-radius: 50%;
    background: #e5484d;
    border: 2px solid #fff;
    display: none;
  }
  .flag-btn.listening .rec-dot { display: block; }

  /* ===== 텍스트 영역 ===== */
  .text-area {
    flex: 1 1 auto;
    min-width: 0;
    max-height: calc(50vh - var(--pad) * 2);
    display: flex;
    flex-direction: column;
  }
  .status-label {
    font-size: var(--fs-status);
    font-weight: 700;
    margin: 0 0 0.6em 0;
    letter-spacing: 0.3px;
    flex: 0 0 auto;
  }
  #patientHalf .status-label { color: var(--patient-sub); }
  #doctorHalf .status-label { color: var(--doctor-sub); }
  .status-label.error { color: #e5484d !important; }

  .main-text {
    font-size: var(--fs-main);
    font-weight: 900;
    line-height: 1.35;
    word-break: keep-all;
    overflow-wrap: anywhere;
    overflow-y: auto;
    min-height: 1.35em;
    outline: none;
    border-radius: 8px;
    flex: 0 1 auto;
  }
  #patientHalf .main-text { color: var(--patient-text); }
  #doctorHalf .main-text { color: var(--doctor-text); }
  /* 내가 한 말(인식 결과): 한 단계 작게, 점선 밑줄 = 눌러서 고칠 수 있음 */
  .main-text.own {
    font-size: var(--fs-own);
    font-weight: 700;
    text-decoration: underline dashed;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.25em;
    cursor: text;
  }
  #patientHalf .main-text.own { text-decoration-color: rgba(0,0,0,0.25); }
  #doctorHalf .main-text.own { text-decoration-color: rgba(255,255,255,0.4); }
  #patientHalf .main-text.own:focus { background: rgba(0,0,0,0.05); text-decoration: none; }
  #doctorHalf .main-text.own:focus { background: rgba(255,255,255,0.12); text-decoration: none; }
  .main-text.live { opacity: 0.6; }

  .retranslate-btn {
    display: none;
    align-self: flex-start;
    margin-top: 0.7em;
    padding: 0.55em 1.1em;
    font-size: var(--fs-status);
    font-weight: 800;
    font-family: inherit;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    flex: 0 0 auto;
  }
  #patientHalf .retranslate-btn { background: var(--accent); color: #fff; }
  #doctorHalf .retranslate-btn { background: #fff; color: var(--accent); }
  .retranslate-btn.show { display: inline-block; }

  /* ===== 브랜드 로고 ===== */
  .brand-logo {
    position: absolute;
    top: calc(var(--pad) * 0.8);
    left: calc(var(--pad) * 1.1);
    height: var(--logo-h);
    width: auto;
    opacity: 0.85;
    pointer-events: none;
  }
  #doctorHalf .brand-mark {
    position: absolute;
    bottom: calc(var(--pad) * 0.8);
    right: calc(var(--pad) * 1.1);
    height: calc(var(--logo-h) * 1.4);
    width: auto;
    opacity: 0.85;
    filter: brightness(0) invert(1);
    pointer-events: none;
  }

  /* ===== 중앙 상태 표시 ===== */
  #centerIndicator {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(1);
    width: var(--center);
    height: var(--center);
    border-radius: 50%;
    background: var(--divider-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    transition: transform 0.06s linear;
    pointer-events: none;
  }
  #centerIndicator img { width: 46%; height: 46%; object-fit: contain; }
  #centerIndicator .center-icon-alt { display: none; }
  #centerIndicator.state-listening .center-icon-logo,
  #centerIndicator.state-converting .center-icon-logo { display: none; }
  #centerIndicator.state-listening .icon-listening { display: block; }
  #centerIndicator.state-converting .icon-converting { display: block; animation: spinIcon 1s linear infinite; }
  #centerIndicator.state-translating .center-icon-logo { animation: blink 0.9s ease-in-out infinite; }
  #centerIndicator.state-listening:not(.metered) { animation: centerPulse 1.1s ease-in-out infinite; }
  @keyframes spinIcon { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes centerPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.15); }
  }

  .settings-btn {
    position: absolute;
    top: 28px;
    right: 28px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    cursor: pointer;
  }

  /* settings panel */
  #settingsOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #settingsOverlay.open { display: flex; }
  #settingsPanel {
    background: #ffffff;
    border-radius: 24px;
    padding: 40px;
    width: 640px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  #settingsPanel h2 {
    margin: 0 0 24px 0;
    font-size: 32px;
    font-weight: 900;
    color: #3a3a3a;
  }
  .lang-option {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 16px;
    border-radius: 14px;
    font-size: 26px;
    font-weight: 700;
    cursor: pointer;
    border: 3px solid transparent;
    margin-bottom: 8px;
    color: #3a3a3a;
  }
  .lang-option.selected {
    border-color: var(--accent);
    background: #f1f1f1;
  }
  .lang-option .flag-emoji { font-size: 34px; }
  .lang-option img.flag-emoji {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.1);
  }

  /* 용어집 설정 탭 */
  .settings-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .settings-tab {
    flex: 1;
    padding: 14px;
    font-size: 22px;
    font-weight: 900;
    border: 3px solid #eee;
    border-radius: 12px;
    background: #fff;
    color: #9a9a9a;
    cursor: pointer;
  }
  .settings-tab.active {
    border-color: var(--accent);
    color: #3a3a3a;
    background: #f1f1f1;
  }
  .settings-panel-content { display: none; }
  .settings-panel-content.active { display: block; }
  .glossary-hint {
    font-size: 16px;
    color: #9a9a9a;
    margin: 0 0 16px 0;
    font-weight: 700;
    line-height: 1.5;
  }
  .glossary-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .glossary-row input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font-size: 18px;
    font-weight: 700;
    border: 2px solid #eee;
    border-radius: 10px;
    color: #3a3a3a;
    font-family: inherit;
  }
  .glossary-row .glossary-arrow { color: #b9b9b9; font-weight: 900; font-size: 18px; }
  .glossary-row .glossary-del {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 10px;
    background: #f1f1f1;
    color: #9a9a9a;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
  }
  #addGlossaryBtn {
    margin-top: 10px;
    width: 100%;
    padding: 14px;
    font-size: 20px;
    font-weight: 900;
    border: 2px dashed #ccc;
    border-radius: 12px;
    background: #fff;
    color: #9a9a9a;
    cursor: pointer;
  }
  #closeSettings {
    margin-top: 20px;
    width: 100%;
    padding: 18px;
    font-size: 26px;
    font-weight: 900;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .version-tag {
    margin: 14px 0 0 0;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #c3c3c3;
    letter-spacing: 0.3px;
  }
  #doctorHalf .settings-btn {
    background: rgba(255,255,255,0.14);
    top: calc(var(--pad) * 0.6);
    right: calc(var(--pad) * 0.8);
    width: clamp(40px, 7vmin, 64px);
    height: clamp(40px, 7vmin, 64px);
    font-size: clamp(20px, 3.5vmin, 32px);
  }
  .engine-info {
    margin: 6px 0 0 0;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #b0b0b0;
  }
</style>
</head>

const GLOSSARY_STORAGE_KEY = 'transloatr_glossary';

function loadGlossary() {

    if (saved) return JSON.parse(saved);
  } catch (e) {}
  return DEFAULT_GLOSSARY.slice();
}

function saveGlossary() {
  try {
    localStorage.setItem(GLOSSARY_STORAGE_KEY, JSON.stringify(glossary));
  } catch (e) {}
}

let glossary = loadGlossary();

const glossaryListEl = document.getElementById('glossaryList');

function renderGlossaryList() {
  glossaryListEl.innerHTML = '';
  glossary.forEach((entry, idx) => {
    const row = document.createElement('div');
    row.className = 'glossary-row';
    row.innerHTML = `
      <input type="text" value="${escapeAttr(entry.ko)}" placeholder="한국어 (예: 발치)" data-field="ko">
      <span class="glossary-arrow">→</span>
      <input type="text" value="${escapeAttr(entry.en)}" placeholder="영어 표현 (예: pull out the tooth)" data-field="en">
      <button class="glossary-del" aria-label="삭제">✕</button>
    `;
    const koInput = row.querySelector('input[data-field="ko"]');
    const enInput = row.querySelector('input[data-field="en"]');
    koInput.addEventListener('input', () => { glossary[idx].ko = koInput.value; saveGlossary(); });

function escapeAttr(str) {
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

  glossary.push({ ko: '', en: '' });

// 텍스트 안의 용어집 항목을 플레이스홀더로 치환 (번역 API가 임의로 바꾸지 못하게 보호)
function applyGlossaryBeforeTranslate(text) {
  let processed = text;
  const placeholderMap = {};
  let counter = 0;
  glossary
    .filter(e => e.ko && e.ko.trim() && e.en && e.en.trim())
    .sort((a, b) => b.ko.length - a.ko.length) // 긴 표현 먼저 치환
    .forEach(entry => {
      if (processed.includes(entry.ko)) {
        counter += 1;
        const token = `Ω${counter}Ω`;
        placeholderMap[token] = entry.en;
        processed = processed.split(entry.ko).join(token);
      }
    });
  return { processed, placeholderMap };
}

function restoreGlossaryAfterTranslate(translated, placeholderMap) {
  let result = translated;
  Object.keys(placeholderMap).forEach(token => {
    // 번역 결과에서 대소문자/공백이 살짝 바뀌는 경우까지 대응
    const pattern = new RegExp(token.replace(/Ω/g, '\\s*Ω\\s*'), 'gi');
    result = result.replace(pattern, placeholderMap[token]);
  });
  return result;
}

// ===================== 음성인식 엔진 결정 =====================
// 1순위 cloud: 국기 누르는 동안 녹음 → 다시 누르면 구글 Speech-to-Text로 한 번에 인식
//   (끊김/중복 문제 없음, 치과 용어 힌트 적용 가능)
// 2순위 browser: 크롬 내장 음성인식 (Speech-to-Text API가 꺼져 있을 때 자동 사용)
let sttEngine = 'checking';
let engineNote = '';

function pickRecorderFormat() {
  if (!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return null;
  const options = [
    { mime: 'audio/webm;codecs=opus', encoding: 'WEBM_OPUS' },
    { mime: 'audio/ogg;codecs=opus', encoding: 'OGG_OPUS' },
  ];
  return options.find(o => MediaRecorder.isTypeSupported(o.mime)) || null;
}

const enginePromise = (async function detectEngine() {
  const fmt = pickRecorderFormat();
  if (fmt) {
    try {
      // 오디오 없이 요청: API가 켜져 있으면 400(오디오 없음), 꺼져 있거나 키가 막혀 있으면 403
      const res = await fetch(`https://speech.googleapis.com/v1/speech:recognize?key=${API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ config: { languageCode: 'ko-KR', encoding: fmt.encoding, sampleRateHertz: 48000 }, audio: { content: '' } }),
      });
      if (res.status === 400 || res.ok) {
        sttEngine = 'cloud';
        engineNote = '음성인식: Google Speech-to-Text (권장)';
      } else {
        const d = await res.json().catch(() => ({}));
        engineNote = '음성인식: 크롬 내장 (Google Speech-to-Text 사용 불가 — ' + ((d.error && d.error.status) || res.status) + ')';
      }
    } catch (e) {
      engineNote = '음성인식: 크롬 내장 (Google Speech-to-Text 연결 실패)';
    }
  } else {
    engineNote = '음성인식: 크롬 내장 (이 브라우저는 녹음 방식 미지원)';
  }
  if (sttEngine !== 'cloud') sttEngine = SR ? 'browser' : 'none';
  if (sttEngine === 'none') engineNote = '이 브라우저는 음성인식을 지원하지 않습니다. 크롬을 사용해주세요.';
  document.getElementById('engineInfo').textContent = engineNote;
})();

// ===================== cloud 엔진: 녹음 =====================
let rec = null; // { stream, recorder, chunks, format, timer, audioCtx, rafId }

async function startCloudRecording(side) {
  const format = pickRecorderFormat();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  const recorder = new MediaRecorder(stream, { mimeType: format.mime });
  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.start(250);
  rec = { stream, recorder, chunks, format, timer: null, audioCtx: null, rafId: null };
  rec.timer = setTimeout(() => { if (busy && busy.side === side && busy.phase === 'recording') stopRecording(); }, MAX_RECORD_MS);
  startMeter(stream);
}

function stopCloudRecording() {
  return new Promise((resolve) => {
    const r = rec;
    if (!r) return resolve(null);
    clearTimeout(r.timer);
    r.recorder.onstop = () => {
      r.stream.getTracks().forEach(t => t.stop());
      stopMeter();
      rec = null;
      resolve({ blob: new Blob(r.chunks, { type: r.format.mime }), format: r.format });
    };
    try { r.recorder.stop(); } catch (e) { r.recorder.onstop(); }
  });
}

// 녹음 중 목소리 크기에 맞춰 중앙 원이 커졌다 작아짐 (마이크가 소리를 듣고 있다는 확인용)
function startMeter(stream) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    ctx.createMediaStreamSource(stream).connect(analyser);
    const data = new Uint8Array(analyser.fftSize);
    rec.audioCtx = ctx;
    centerIndicator.classList.add('metered');
    const loop = () => {
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
      const level = Math.min(Math.sqrt(sum / data.length) * 5, 0.45);
      centerIndicator.style.transform = `translate(-50%, -50%) scale(${1 + level})`;
      if (rec) rec.rafId = requestAnimationFrame(loop);
    };
    loop();
  } catch (e) { /* 미터는 없어도 동작에 지장 없음 */ }
}
function stopMeter() {
  if (rec && rec.rafId) cancelAnimationFrame(rec.rafId);
  if (rec && rec.audioCtx) rec.audioCtx.close().catch(() => {});
  centerIndicator.classList.remove('metered');
  centerIndicator.style.transform = '';
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

function sttLanguageCode(code) {
  return code === 'zh-CN' ? 'cmn-Hans-CN' : code;
}

function hintPhrases() {
  const set = new Set(DENTAL_HINTS);
  glossary.forEach(g => { if (g.ko && g.ko.trim()) set.add(g.ko.trim().slice(0, 100)); });
  return Array.from(set).slice(0, 500);
}

async function cloudRecognize(blob, format, langCode, useHints = true) {
  const content = await blobToBase64(blob);
  const config = {
    encoding: format.encoding,
    sampleRateHertz: 48000,
    languageCode: sttLanguageCode(langCode),
    enableAutomaticPunctuation: true,
    maxAlternatives: 1,
  };
  if (useHints && langCode === 'ko-KR') config.speechContexts = [{ phrases: hintPhrases(), boost: 12 }];
  let res, data;
  try {
    res = await fetch(`https://speech.googleapis.com/v1/speech:recognize?key=${API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ config, audio: { content } }),
    });
    data = await res.json().catch(() => ({}));
  } catch (e) {
    return { error: '인터넷 연결 실패' };
  }
  if (!res.ok) {
    // 힌트 설정 때문에 거절되면 힌트 없이 한 번 더
    if (config.speechContexts && res.status === 400) return cloudRecognize(blob, format, langCode, false);
    return { error: (data.error && data.error.message) || ('HTTP ' + res.status) };
  }
  const text = (data.results || [])
    .map(r => (r.alternatives && r.alternatives[0] && r.alternatives[0].transcript) || '')
    .join(' ')
    .replace(/\s+/g, ' ')
    .trim();
  return { text };
}

// ===================== browser 엔진 (예비): 짧게 끊어 듣고 이어붙이기 =====================
// continuous 모드는 안드로이드 크롬에서 결과가 중복·누적되는 문제가 있어 쓰지 않음.
// 대신 한 문장씩 듣고 끝나면 자동으로 다시 시작, 결과는 중복 제거 후 이어붙임.
let bsession = null;

function squash(s) { return s.replace(/[\s.,!?。、，！？]/g, ''); }
function mergeSegment(list, seg) {
  seg = seg.trim();
  if (!seg) return;
  const last = list[list.length - 1];
  if (!last) { list.push(seg); return; }
  const a = squash(last), b = squash(seg);
  if (a === b || a.includes(b)) return;         // 같은 말 반복 → 버림
  if (b.startsWith(a)) { list[list.length - 1] = seg; return; } // 앞부분 포함한 누적 결과 → 교체
  list.push(seg);
}

function startBrowserRecognition(side) {
  const lang = langOf(side).code;
  bsession = { side, active: true, segments: [], interim: '', error: null, resolve: null, rec: null };
  const s = bsession;

  const run = () => {
    const r = new SR();
    s.rec = r;
    r.lang = lang;
    r.continuous = false;
    r.interimResults = true;
    r.maxAlternatives = 1;
    let finals = [];
    r.onresult = (e) => {
      finals = [];
      let interim = '';
      for (let i = 0; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) mergeSegment(finals, t); else interim = t;
      }
      s.interim = interim;
      showLive(side, s);
    };
    r.onerror = (e) => {
      if (e.error !== 'no-speech' && e.error !== 'aborted') s.error = e.error;
    };
    r.onend = () => {
      finals.forEach(f => mergeSegment(s.segments, f));
      s.interim = '';
      if (s.active && !s.error) {
        try { run(); } catch (err) { s.error = String(err); finishBrowser(s); }
      } else {
        finishBrowser(s);
      }
    };
    r.start();
  };
  run();
}

function showLive(side, s) {
  const live = s.segments.concat(s.interim ? [s.interim] : []).join(' ');
  setHalf(side, { text: live, role: 'own', live: true });
}

function finishBrowser(s) {
  if (s.resolve) {
    const r = s.resolve;
    s.resolve = null;
    r(s.error ? { error: browserErrorText(s.error) } : { text: s.segments.join(' ').trim() });
  } else {
    s.done = true;
    // 녹음 중(국기 다시 누르기 전)에 마이크 권한 등 오류로 끝난 경우: 바로 오류 표시
    if (s.error && bsession === s && busy && busy.phase === 'recording') failAndReset(s.side, browserErrorText(s.error));
  }
}

function stopBrowserRecognition() {
  return new Promise((resolve) => {
    const s = bsession;
    if (!s) return resolve({ text: '' });
    s.active = false;
    if (s.done) return resolve(s.error ? { error: browserErrorText(s.error) } : { text: s.segments.join(' ').trim() });
    s.resolve = resolve;
    try { s.rec.stop(); } catch (e) { finishBrowser(s); }
  });
}

function browserErrorText(code) {
  const map = { 'not-allowed': '마이크 권한이 꺼져 있음', 'service-not-allowed': '음성인식 서비스 사용 불가', 'network': '인터넷 연결 문제', 'audio-capture': '마이크를 찾을 수 없음' };
  return map[code] || code;
}

function micErrorText(e) {
  const name = e && e.name;
  if (name === 'NotAllowedError' || name === 'SecurityError') return '마이크 권한이 꺼져 있음';
  if (name === 'NotFoundError') return '마이크를 찾을 수 없음';
  if (name === 'NotReadableError') return '다른 앱이 마이크를 사용 중';
  return (e && e.message) || String(e);
}

// ===================== 번역 =====================
async function translateText(text, fromShort, toShort) {
  try {
    const res = await fetch(`https://translation.googleapis.com/language/translate/v2?key=${API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q: text, source: fromShort, target: toShort, format: 'text' }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) return { error: (data.error && data.error.message) || ('HTTP ' + res.status) };
    const t = data && data.data && data.data.translations && data.data.translations[0] && data.data.translations[0].translatedText;
    return t ? { text: decodeHtmlEntities(t) } : { error: '빈 번역 결과' };
  } catch (e) {
    return { error: '인터넷 연결 실패' };
  }
}

function decodeHtmlEntities(str) {
  const el = document.createElement('textarea');
  el.innerHTML = str;
  return el.value;
}

function speak(text, langCode) {
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = langCode;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

// 말한 사람(side)의 문장을 상대방 언어로 번역해 상대방 화면에 크게 표시
async function translateFor(side, text) {
  const to = other(side);
  const from = langOf(side);
  const target = langOf(to);
  setHalf(to, { status: 'translating', live: false });
  setCenter('translating');

  const useGlossary = side === 'doctor' && target.short === 'en';
  let toSend = text;
  let map = {};
  if (useGlossary) {
    const r = applyGlossaryBeforeTranslate(text);
    toSend = r.processed;
    map = r.placeholderMap;
  }
  const result = await translateText(toSend, from.short, target.short);
  if (result.text) {
    const translated = useGlossary ? restoreGlossaryAfterTranslate(result.text, map) : result.text;
    setHalf(to, { status: 'incoming', text: translated, role: 'incoming', error: '' });
    speak(translated, target.code);
  } else {
    setHalf(to, { status: 'error', error: result.error, text: '', role: null });
  }
}

// ===================== 국기 누르기: 시작 / 종료 =====================
async function onFlagTap(side) {
  if (busy) {
    if (busy.side === side && busy.phase === 'recording') stopRecording();
    return;
  }
  await enginePromise;
  if (busy) return;
  if (sttEngine === 'none') {
    setHalf(side, { status: 'error', error: '이 브라우저는 음성인식을 지원하지 않음 (크롬 사용)' });
    return;
  }
  startRecording(side);
}

function startRecording(side) {
  try { window.speechSynthesis.cancel(); } catch (e) {} // 번역 음성이 마이크에 다시 들어가지 않게
  busy = { side, phase: 'recording', ready: null };
  lastRecognized[side] = '';
  setHalf(side, { status: 'listening', text: '', role: null, error: '', live: false });
  setHalf(other(side), { status: 'waiting' });
  setCenter('listening');

  busy.ready = (async () => {
    try {
      if (sttEngine === 'cloud') await startCloudRecording(side);
      else startBrowserRecognition(side);
      return true;
    } catch (e) {
      failAndReset(side, micErrorText(e));
      return false;
    }
  })();
}

async function stopRecording() {
  const b = busy;
  if (!b || b.phase !== 'recording') return;
  b.phase = 'processing';
  const side = b.side;
  const ok = await b.ready;
  if (!ok) return;

  setHalf(side, { status: 'recognizing', live: false });
  setCenter('converting');

  let result;
  if (sttEngine === 'cloud') {
    const out = await stopCloudRecording();
    if (!out || out.blob.size < 500) result = { text: '' };
    else result = await cloudRecognize(out.blob, out.format, langOf(side).code);
  } else {
    result = await stopBrowserRecognition();
    bsession = null;
  }

  if (result.error) { failAndReset(side, result.error); return; }
  if (!result.text) {
    busy = null;
    setHalf(side, { status: 'noSpeech', text: '', role: null, live: false });
    restoreStatus(other(side));
    setCenter('idle');
    renderAll();
    return;
  }

  // 1) 내 화면: 인식한 내 말 (눌러서 고칠 수 있음)
  lastRecognized[side] = result.text;
  setHalf(side, { status: 'own', text: result.text, role: 'own', live: false });
  // 2) 상대 화면: 번역해서 크게
  await translateFor(side, result.text);

  busy = null;
  setCenter('idle');
  renderAll();
}

// 상대가 말하는 동안 'waiting'이던 쪽을 원래 표시(받은 번역/내가 한 말/안내)로 되돌림
function restoreStatus(side) {
  const h = halves[side];
  if (h.status !== 'waiting') return;
  setHalf(side, { status: h.role === 'incoming' ? 'incoming' : h.role === 'own' ? 'own' : 'idle' });
}

function failAndReset(side, message) {
  if (rec) { try { rec.recorder.stop(); } catch (e) {} try { rec.stream.getTracks().forEach(t => t.stop()); } catch (e) {} clearTimeout(rec.timer); stopMeter(); rec = null; }
  if (bsession) { bsession.active = false; try { bsession.rec && bsession.rec.abort(); } catch (e) {} bsession = null; }
  busy = null;
  setHalf(side, { status: 'error', error: message, text: '', role: null, live: false });
  restoreStatus(other(side));
  setCenter('idle');
  renderAll();
}

// ===================== 인식 결과 직접 고치기 → 다시 번역 =====================
['doctor', 'patient'].forEach(side => {
  const e = els[side];
  e.flag.addEventListener('click', () => onFlagTap(side));
  e.main.addEventListener('input', () => {
    halves[side].text = e.main.textContent;
    render(side);
  });
  e.retranslate.addEventListener('click', async () => {
    if (busy) return;
    const text = halves[side].text.trim();
    if (!text) return;
    e.main.blur();
    busy = { side, phase: 'processing' };
    lastRecognized[side] = text;
    render(side);
    await translateFor(side, text);
    busy = null;
    setCenter('idle');
    renderAll();
  });
});

function flagUrl(country) { return FLAGS[country]; }

function applyPatientLang() {
  patientFlagImg.src = flagUrl(patientLang.country);
  patientFlagImg.alt = patientLang.name;
  render('patient');
}

function renderLangList() {
  langList.innerHTML = '';
  LANGS.forEach(l => {
    const div = document.createElement('div');
    div.className = 'lang-option' + (l.code === patientLang.code ? ' selected' : '');
    div.innerHTML = `<img class="flag-emoji" src="${flagUrl(l.country)}" alt=""><span>${l.name}</span>`;
    div.addEventListener('click', () => {
      if (busy) return;
      patientLang = l;
      // 언어를 바꾸면 이전 대화는 지움 (다른 언어 문장이 섞이지 않게)
      Object.assign(halves.patient, { status: 'idle', text: '', role: null, error: '', live: false });
      Object.assign(halves.doctor, { status: 'idle', text: '', role: null, error: '', live: false });
      applyPatientLang();
      renderAll();
      renderLangList();
    });
    langList.appendChild(div);
  });
}

document.getElementById('openSettingsBtn').addEventListener('click', () => {
  if (busy) return;
  renderLangList();
  renderGlossaryList();
  settingsOverlay.classList.add('open');
});
document.getElementById('closeSettings').addEventListener('click', () => settingsOverlay.classList.remove('open'));
settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('open'); });

const tabLangBtn = document.getElementById('tabLangBtn');
const tabGlossaryBtn = document.getElementById('tabGlossaryBtn');
const langPanel = document.getElementById('langPanel');
const glossaryPanel = document.getElementById('glossaryPanel');
tabLangBtn.addEventListener('click', () => {
  tabLangBtn.classList.add('active'); tabGlossaryBtn.classList.remove('active');
  langPanel.classList.add('active'); glossaryPanel.classList.remove('active');
});
tabGlossaryBtn.addEventListener('click', () => {
  tabGlossaryBtn.classList.add('active'); tabLangBtn.classList.remove('active');
  glossaryPanel.classList.add('active'); langPanel.classList.remove('active');
});

applyPatientLang();
renderAll();
</script>

</html>
